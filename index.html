<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>나무증권 리뷰 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --line:#e7e9ee; --text:#17191d; --sub:#646b77; --faint:#9aa1ad;
  --android:#1a9b5e; --android-soft:#e6f5ed;
  --ios:#2f62e6; --ios-soft:#e9effd;
  --bad:#e0483e; --mid:#e8a317; --star:#f2a516;
  --chip:#f0f2f5; --shadow:0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:36px 16px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:25px;margin:0;letter-spacing:-.02em}
.updated{color:var(--sub);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
h2{font-size:16px;margin:0 0 12px;font-weight:600}

/* 스토어별 카드 */
.stores{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.store{padding:22px 24px;border-top:3px solid var(--c)}
.store[data-s=android]{--c:var(--android);--cs:var(--android-soft)}
.store[data-s=ios]{--c:var(--ios);--cs:var(--ios-soft)}
.store-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:17px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.official{font-size:14px;color:var(--sub);background:var(--cs);border-radius:6px;padding:3px 8px}
.official b{color:var(--text)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.mini .l{font-size:13px;color:var(--sub)}
.mini .v{font-size:25px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini .s{font-size:13px;color:var(--faint)}
.dist-row{display:grid;grid-template-columns:32px 1fr 88px;align-items:center;gap:8px;margin:5px 0;font-size:14px;cursor:pointer;border-radius:6px;padding:1px 4px;margin-left:-4px;margin-right:-4px}
.dist-row:hover{background:var(--chip)}
.dist-row.on{font-weight:700;background:var(--cs)}
.bar{height:10px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px}
.dist-row .n{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.empty-store{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--sub);font-size:15px;line-height:1.6}

/* 추이 */
.panel{padding:22px 24px;margin-bottom:16px}
.legend{display:flex;gap:14px;font-size:14px;color:var(--sub);margin:-4px 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.legend i.box{height:10px;width:10px;vertical-align:-1px;opacity:.25}
#trend{width:100%;height:270px;display:block}

/* 필터 + 목록 */
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px;align-items:center;margin-bottom:16px;position:sticky;top:8px;z-index:5}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button{border:0;background:none;color:var(--sub);font:inherit;font-size:15px;padding:6px 14px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button .dot{width:7px;height:7px;border-radius:50%}
input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 14px;font:inherit;font-size:15px;outline:none}
input[type=search]:focus{border-color:var(--text)}
.count{font-size:14px;color:var(--sub);margin-left:auto}
.clear{border:0;background:var(--chip);color:var(--sub);border-radius:6px;font:inherit;font-size:14px;padding:3px 8px;cursor:pointer}
.body{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:10px}
.rv{padding:18px 22px;border-left:3px solid var(--c)}
.rv[data-s=android]{--c:var(--android)} .rv[data-s=ios]{--c:var(--ios)}
.rv .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.stars{letter-spacing:1px;font-size:15px;color:var(--star)}
.stars .off{color:var(--line)}
.tag{background:var(--chip);border-radius:5px;padding:1px 7px;font-size:13px;color:var(--sub)}
.tag.rep{background:var(--android-soft);color:var(--android)}
.rv .t{font-weight:600;margin-top:6px}
.rv .c{margin-top:4px;white-space:pre-wrap;word-break:break-word}
mark{background:#fff0a8;color:inherit;border-radius:2px;padding:0 1px}
.side{padding:20px 22px;position:sticky;top:90px}
.side table{width:100%;border-collapse:collapse;font-size:15px}
.side td{padding:7px 0;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--chip)}
.side td:nth-child(n+2){text-align:right;color:var(--sub)}
.more{margin:14px auto 0;display:block;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;padding:9px 20px;border-radius:9px;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--sub)}
.note{font-size:14px;color:var(--faint);margin-top:28px;text-align:center}
/* 주간 요약 (아코디언) */
.weekly{padding:0;margin-bottom:16px;overflow:hidden}
.weekly summary{list-style:none;cursor:pointer;user-select:none}
.weekly summary::-webkit-details-marker{display:none}
.chev{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.chev::before{content:"";width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open] > summary .chev::before{transform:translateY(2px) rotate(-135deg)}
summary:hover .chev{background:var(--chip)}
summary:focus-visible{outline:2px solid var(--ios);outline-offset:-2px;border-radius:12px}
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px}
.wk-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wk-title h2{margin:0;font-size:18px}
.wk-title .period{font-size:15px;color:var(--sub)}
.wk-body{padding:0 24px 22px}
.wk-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wk-tools .gen{font-size:13px;color:var(--faint)}
.wk-tools select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--text)}
.wk-lines{margin:0 0 14px;padding:0;list-style:none;font-size:16px;line-height:1.7}
.wk-lines li{padding-left:14px;position:relative}
.wk-lines li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--star)}
.wk-acc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wk-acc + .wk-acc{margin-top:8px}
.wk-acc-head{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 20px}
.wk-acc-head .sname{display:flex;align-items:center;gap:6px;font-weight:700;flex:none}
.wk-acc-head .sname i{width:8px;height:8px;border-radius:50%}
.wk-peek{flex:1;font-size:15px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-acc[open] .wk-peek{visibility:hidden}
.wk-store{display:flex;flex-direction:column;padding:4px 20px 20px}
.wk-store > div + div{margin-top:18px;padding-top:18px;border-top:1px solid var(--chip)}
.wk-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,180px));gap:14px}
.wk-kpi .l{font-size:13px;color:var(--sub)}
.wk-kpi .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:600;margin-left:3px}
.up{color:var(--bad)} .down{color:var(--android)} .flat{color:var(--faint)}
.up.good{color:var(--android)} .down.good{color:var(--bad)}
.wk-sub{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:8px}
.wk-cat{display:grid;grid-template-columns:130px minmax(0,520px) 84px;gap:10px;align-items:center;font-size:14px;margin:5px 0}
.wk-cat .bar{height:7px}
.wk-cat .n{text-align:right;font-variant-numeric:tabular-nums}
.quote{font-size:15px;line-height:1.6;padding:10px 14px;border-radius:8px;background:#f8f9fb;border:1px solid #eef0f3;margin-bottom:6px}
.quote .meta{font-size:13px;color:var(--sub);margin-bottom:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quote.good{background:#fff7e0}
.wk-empty{color:var(--sub);font-size:15px;padding:6px 0}
@media (max-width:600px){.wk-kpi{grid-template-columns:repeat(2,1fr)}.wk-cat{grid-template-columns:100px 1fr 72px}}

/* 카테고리 */
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cat-head .hint{font-size:14px;color:var(--faint)}
.cat-grid{display:grid;grid-template-columns:150px 1fr 1fr;gap:4px 20px;align-items:center;font-size:15px}
.cat-grid .h{font-size:13px;color:var(--sub);padding-bottom:4px;display:flex;align-items:center;gap:6px}
.cat-grid .h i{width:7px;height:7px;border-radius:50%}
.cat-row{display:contents;cursor:pointer}
.cat-row > *{padding:7px 0;border-radius:6px}
.cat-row:hover > *{background:var(--chip)}
.cat-row.on > *{background:#fff7e0}
.cat-name{display:flex;align-items:center;gap:7px;font-weight:500;padding-left:6px!important}
.cat-name i{width:9px;height:9px;border-radius:3px;flex:none}
.cat-cell{display:grid;grid-template-columns:1fr 124px;gap:8px;align-items:center;padding-right:6px!important}
.cat-cell .bar{height:8px}
.cat-cell .n{font-size:14px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:8px;border-top:1px solid var(--chip)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--sub);font:inherit;font-size:14px;padding:5px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:7px;height:7px;border-radius:50%}
.chip b{font-weight:600;color:var(--faint)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip.on b{color:#c9ced6}
.ctag{border-radius:5px;padding:1px 7px;font-size:13px;font-weight:600}
@media (max-width:860px){.cat-grid{grid-template-columns:96px 1fr 1fr;gap:4px 8px}.cat-cell{grid-template-columns:1fr}.cat-cell .n{text-align:left}}
@media (max-width:860px){.stores,.body{grid-template-columns:1fr}.side{position:static}.filters{position:static}}
@media (max-width:480px){.mini{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>나무증권 앱 리뷰</h1>
      <div class="updated" id="updated">불러오는 중…</div>
    </div>
    <div class="seg" id="f-period" aria-label="기간">
      <button data-v="7">7일</button><button data-v="30">30일</button><button data-v="90">90일</button><button data-v="0" class="on">전체</button>
    </div>
  </header>

  <section class="card weekly" id="weekly" hidden></section>

  <section class="stores" id="stores"></section>

  <section class="card panel">
    <div class="cat-head"><h2>카테고리별 리뷰</h2><span class="hint">눌러서 아래 목록 필터 · 리뷰 하나가 여러 카테고리에 속할 수 있음</span></div>
    <div class="cat-grid" id="cats"></div>
  </section>

  <section class="card panel">
    <h2>주간 평균 별점 추이</h2>
    <div class="legend">
      <span><i style="background:var(--android)"></i>Android 평균 별점</span>
      <span><i style="background:var(--ios)"></i>iOS 평균 별점</span>
      <span><i class="box" style="background:var(--android)"></i><i class="box" style="background:var(--ios);margin-left:-3px"></i>주간 리뷰 수</span>
    </div>
    <svg id="trend" role="img" aria-label="스토어별 주간 평균 별점 추이"></svg>
  </section>

  <section class="card filters">
    <div class="seg" id="f-store" aria-label="스토어">
      <button data-v="android" class="on"><span class="dot" style="background:var(--android)"></span>Android</button>
      <button data-v="ios"><span class="dot" style="background:var(--ios)"></span>iOS</button>
    </div>
    <input type="search" id="f-q" placeholder="키워드 검색 (예: 로그인, 체결, 오류)">
    <span class="count" id="count"></span>
    <div class="chips" id="chips"></div>
  </section>

  <section class="body">
    <div>
      <div class="list" id="list"></div>
      <button class="more" id="more" hidden>더 보기</button>
    </div>
    <aside class="card side">
      <h2 id="ver-title">버전별 평균</h2>
      <table id="ver"></table>
    </aside>
  </section>

  <p class="note">Google Play·App Store 공개 데이터 기준 · 스토어 평점은 별점만 남긴 사용자 포함 · 매일 아침 8시 자동 갱신</p>
</div>

<script>
const STORES = { android: "Android", ios: "iOS" };
const S = { all: [], meta: {}, cats: [], store: "android", period: 0, rating: 0, cat: "", q: "", shown: 30 };
const ETC = { name: "기타", color: "#adb5bd" };
const catOf = (name) => S.cats.find((c) => c.name === name) || ETC;
function classify(r) {
  const t = (r.title + " " + r.content).toLowerCase();
  const hit = S.cats.filter((c) => r.rating >= (c.minRating || 1) && c.keywords.some((k) => t.includes(k.toLowerCase()))).map((c) => c.name);
  return hit.length ? hit : [ETC.name];
}
const $ = (id) => document.getElementById(id);
const DAY = 864e5;
const fmtDate = (d) => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const tone = (v) => v < 2.5 ? "var(--bad)" : v < 3.5 ? "var(--mid)" : "var(--text)";
const avg = (a) => a.length ? a.reduce((s, r) => s + r.rating, 0) / a.length : 0;

Promise.all([
  fetch("data/reviews.json?" + Date.now()).then((r) => r.json()),
  fetch("categories.json?" + Date.now()).then((r) => r.json()).catch(() => []),
  fetch("data/weekly.json?" + Date.now()).then((r) => r.json()).catch(() => []),
]).then(([d, cats, weeks]) => {
  S.cats = cats;
  weekly(weeks, 0);
  S.all = d.reviews.map((r) => { const x = { ...r, d: new Date(r.date) }; x.cats = classify(x); return x; });
  S.meta = d.meta || {};
  $("updated").textContent = "마지막 수집 " + new Date(S.meta.updated).toLocaleString("ko-KR");
  render();
}).catch(() => { $("updated").textContent = "데이터를 불러오지 못했어요"; });

const inPeriod = () => { const now = Date.now(); return S.all.filter((r) => !S.period || now - r.d < S.period * DAY); };

function render() {
  const p = inPeriod();
  stores(p); cats(p); trend(p);
  const q = S.q.trim().toLowerCase();
  const mine = p.filter((r) => r.store === S.store);
  const noCat = mine.filter((r) => (!S.rating || r.rating === S.rating) && (!q || (r.title + " " + r.content).toLowerCase().includes(q)));
  const f = S.cat ? noCat.filter((r) => r.cats.includes(S.cat)) : noCat;
  versions(mine); chips(noCat); list(f);
}

const allCats = () => [...S.cats, ETC];

function weekly(weeks, idx) {
  const el = $("weekly");
  if (!weeks.length) { el.hidden = true; return; }
  el.hidden = false;
  const w = weeks[idx];
  const md = (s) => { const d = new Date(s + "T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]})`; };
  const delta = (cur, prev, digits, goodWhenUp, neutral) => {
    if (prev == null || cur == null) return "";
    const d = cur - prev, cls = neutral || Math.abs(d) < (digits ? 0.05 : 1) ? "flat" : d > 0 ? "up" : "down";
    return `<span class="delta ${cls} ${goodWhenUp ? "good" : ""}">${d > 0 ? "▲" : d < 0 ? "▼" : "–"}${Math.abs(d).toFixed(digits)}</span>`;
  };
  const quote = (q, good) => `<div class="quote ${good ? "good" : ""}"><div class="meta"><span class="stars">${"★".repeat(q.rating)}<span class="off">${"★".repeat(5 - q.rating)}</span></span>${q.likes ? `<span>👍 ${q.likes}</span>` : ""}${q.cats.filter((n) => n !== "기타").map((n) => { const c = catOf(n); return `<span class="ctag" style="color:${c.color};background:${c.color}1a">${esc(n)}</span>`; }).join("")}</div>${esc(q.content)}${q.content.length >= 200 ? "…" : ""}</div>`;
  const stores = Object.entries(STORES).map(([k, name]) => {
    const x = w.stores[k];
    if (!x || !x.count) return "";
    const max = Math.max(1, ...x.top_categories.map((c) => c.count));
    const top = x.top_categories.find((c) => c.name !== "기타");
    return `<details class="wk-acc" data-k="wk-${k}" ${isOpen("wk-" + k) ? "open" : ""}>
      <summary class="wk-acc-head">
        <span class="sname"><i style="background:var(--${k})"></i>${name}</span>
        <span class="wk-peek">리뷰 ${x.count}건 · <b style="color:${tone(x.avg)}">★${x.avg.toFixed(1)}</b>${top ? ` · 주요 주제 ${esc(top.name)}` : ""}</span>
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="wk-store">
      <div>
        <div class="wk-kpi">
          <div><div class="l">리뷰</div><div class="v">${x.count}${delta(x.count, x.prev_count, 0, false, true)}</div></div>
          <div><div class="l">리뷰 평균</div><div class="v" style="color:${tone(x.avg)}">★${x.avg.toFixed(1)}${delta(x.avg, x.prev_avg, 1, true)}</div></div>
          <div><div class="l">스토어 평점</div><div class="v">${x.store_score ? "★" + x.store_score.toFixed(2) : "–"}${delta(x.store_score, x.prev_store_score, 2, true)}</div></div>
          <div><div class="l">1~2점 비율</div><div class="v">${x.neg_ratio}%</div></div>
        </div>
      </div>
      <div>
        <div class="wk-sub">많이 언급된 주제 <span style="font-weight:400;color:var(--faint)">· 전주 대비</span></div>
        ${x.top_categories.map((c) => { const cc = catOf(c.name); return `<div class="wk-cat"><span>${esc(c.name)}</span><div class="bar"><span style="width:${c.count / max * 100}%;background:${cc.color}"></span></div><span class="n">${c.count}건${delta(c.count, c.prev, 0)}</span></div>`; }).join("")}
      </div>
      <div>
        <div class="wk-sub">대표 불만 리뷰</div>
        ${x.complaints.length ? x.complaints.map((q) => quote(q)).join("") : `<div class="wk-empty">1~2점 리뷰 없음</div>`}
        ${x.compliments.length ? `<div class="wk-sub" style="margin-top:12px">좋았던 점</div>${quote(x.compliments[0], true)}` : ""}
      </div>
      </div>
    </details>`;
  }).join("");
  const gen = new Date(w.generated);
  el.innerHTML = `
    <details class="wk" data-k="wk-all" ${isOpen("wk-all") ? "open" : ""}>
      <summary class="wk-head">
        <span class="wk-title"><h2>📋 ${idx === 0 ? "이번 주" : ""} 리뷰 요약</h2><span class="period">${md(w.week_start)} ~ ${md(w.week_end)}</span></span>
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="wk-body">
        <div class="wk-tools">
          <span class="gen">${gen.toLocaleDateString("ko-KR")} ${gen.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })} 생성 · 매주 금요일 아침 8시 업데이트</span>
          ${weeks.length > 1 ? `<select id="wk-sel" aria-label="지난 주간 요약">${weeks.map((h, i) => `<option value="${i}" ${i === idx ? "selected" : ""}>${md(h.week_start)} ~ ${md(h.week_end)}</option>`).join("")}</select>` : ""}
        </div>
        <ul class="wk-lines">${w.headline.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
        ${stores}
      </div>
    </details>`;
  el.querySelectorAll("details[data-k]").forEach((d) => d.addEventListener("toggle", () => saveOpen(d.dataset.k, d.open)));
  const sel = $("wk-sel"); if (sel) sel.onchange = () => weekly(weeks, +sel.value);
}

// 접기/펴기 상태는 이 브라우저에만 기억 (기본: 펼침)
function isOpen(k) { try { return localStorage.getItem("acc:" + k) !== "0"; } catch { return true; } }
function saveOpen(k, open) { try { localStorage.setItem("acc:" + k, open ? "1" : "0"); } catch {} }

function cats(p) {
  const by = {}; Object.keys(STORES).forEach((k) => by[k] = p.filter((r) => r.store === k));
  const rows = allCats().map((c) => {
    const s = {}; Object.keys(STORES).forEach((k) => s[k] = by[k].filter((r) => r.cats.includes(c.name)));
    return { c, s, total: Object.values(s).reduce((n, a) => n + a.length, 0) };
  }).filter((r) => r.total).sort((a, b) => (a.c === ETC) - (b.c === ETC) || b.total - a.total);
  const max = Math.max(1, ...rows.flatMap((r) => Object.values(r.s).map((a) => a.length)));
  const head = `<div></div>` + Object.entries(STORES).map(([k, n]) => `<div class="h"><i style="background:var(--${k})"></i>${n} <span style="color:var(--faint)">(${by[k].length}건 중)</span></div>`).join("");
  $("cats").innerHTML = head + rows.map(({ c, s }) => `
    <div class="cat-row ${S.cat === c.name ? "on" : ""}" data-c="${esc(c.name)}">
      <div class="cat-name"><i style="background:${c.color}"></i>${esc(c.name)}</div>
      ${Object.keys(STORES).map((k) => {
        const a = s[k], pct = by[k].length ? Math.round(a.length / by[k].length * 100) : 0;
        return `<div class="cat-cell"><div class="bar"><span style="width:${a.length / max * 100}%;background:var(--${k})"></span></div>
          <span class="n">${a.length ? `${a.length}건 · ${pct}% · <b style="color:${tone(avg(a))}">★${avg(a).toFixed(1)}</b>` : "–"}</span></div>`;
      }).join("")}
    </div>`).join("");
  $("cats").querySelectorAll(".cat-row").forEach((el) => el.onclick = () => {
    S.cat = S.cat === el.dataset.c ? "" : el.dataset.c; S.shown = 30; render();
    if (S.cat) document.querySelector(".filters").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

function chips(a) {
  const items = allCats().map((c) => ({ c, n: a.filter((r) => r.cats.includes(c.name)).length })).filter((x) => x.n || S.cat === x.c.name);
  $("chips").innerHTML = `<button class="chip ${S.cat ? "" : "on"}" data-c="">전체 <b>${a.length}</b></button>` +
    items.map(({ c, n }) => `<button class="chip ${S.cat === c.name ? "on" : ""}" data-c="${esc(c.name)}"><i style="background:${c.color}"></i>${esc(c.name)} <b>${n}</b></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach((el) => el.onclick = () => { S.cat = el.dataset.c; S.shown = 30; render(); });
}

function stores(p) {
  const now = Date.now();
  $("stores").innerHTML = Object.entries(STORES).map(([k, name]) => {
    const a = p.filter((r) => r.store === k);
    const st = (S.meta.store_stats || {})[k];
    const official = st && st.version ? `<span class="official">최신 버전 <b>v${esc(st.version)}</b></span>` : "";
    const head = `<div class="store-head"><span class="badge"><i></i>${name}</span>${official}</div>`;
    const storeTile = `<div><div class="l">평균 별점 (스토어)</div><div class="v" style="color:${st && st.score ? "var(--text)" : "var(--faint)"}">${st && st.score ? "★" + st.score.toFixed(2) : "–"}</div><div class="s">${st && st.ratings ? Number(st.ratings).toLocaleString() + "명 평가" : ""}</div></div>`;
    if (!a.length) {
      const why = k === "ios" && !S.all.some((r) => r.store === "ios")
        ? "애플 공개 리뷰 피드가 현재 리뷰를 내려주지 않아 수집된 리뷰가 없어요.<br>피드가 다시 응답하면 자동으로 채워져요."
        : "이 기간에 수집된 리뷰가 없어요.";
      return `<div class="card store" data-s="${k}">${head}<div class="mini">${storeTile}</div><div class="empty-store">${why}</div></div>`;
    }
    const w = a.filter((r) => now - r.d < 7 * DAY), pw = a.filter((r) => now - r.d >= 7 * DAY && now - r.d < 14 * DAY);
    const rep = Math.round(a.filter((r) => r.replied).length / a.length * 100);
    const counts = [5,4,3,2,1].map((n) => a.filter((r) => r.rating === n).length);
    const max = Math.max(1, ...counts);
    const dist = [5,4,3,2,1].map((n, i) => {
      const on = S.store === k && S.rating === n;
      const dim = S.store === k && S.rating && !on;
      return `<div class="dist-row ${on ? "on" : ""}" data-s="${k}" data-r="${n}" title="${name} ${n}점 리뷰만 보기">
        <span>${n}★</span>
        <div class="bar"><span style="width:${counts[i] / max * 100}%;background:var(--c);opacity:${dim ? .3 : 1}"></span></div>
        <span class="n">${counts[i]} · ${Math.round(counts[i] / a.length * 100)}%</span></div>`;
    }).join("");
    return `<div class="card store" data-s="${k}">${head}
      <div class="mini">
        ${storeTile}
        <div><div class="l">수집 리뷰</div><div class="v">${a.length.toLocaleString()}</div><div class="s" title="답변률 ${rep}%">리뷰 평균 ★${avg(a).toFixed(2)}</div></div>
        <div><div class="l">최근 7일</div><div class="v">${w.length}</div><div class="s">${w.length ? "★" + avg(w).toFixed(1) + (pw.length ? " · 전주 ★" + avg(pw).toFixed(1) : "") : "새 리뷰 없음"}</div></div>
      </div>${dist}</div>`;
  }).join("");
  $("stores").querySelectorAll(".dist-row").forEach((el) => el.onclick = () => {
    const s = el.dataset.s, n = +el.dataset.r;
    S.rating = S.store === s && S.rating === n ? 0 : n;
    setStore(s); S.shown = 30; render();
  });
}

function trend(p) {
  const svg = $("trend"), W = svg.clientWidth || 800, H = 270, P = { l: 40, r: 44, t: 14, b: 28 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (!p.length) { svg.innerHTML = ""; return; }
  const wk = (d) => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return +x; };
  const start = wk(Math.min(...p.map((r) => +r.d))), end = wk(new Date());
  const weeks = []; for (let t = start; t <= end; t = wk(t + 8 * DAY)) weeks.push(t);
  const by = {}; Object.keys(STORES).forEach((k) => by[k] = new Map(weeks.map((w) => [w, []])));
  p.forEach((r) => { const m = by[r.store].get(wk(r.d)); if (m) m.push(r); });
  const maxN = Math.max(1, ...Object.values(by).flatMap((m) => [...m.values()].map((a) => a.length)));
  const iw = W - P.l - P.r, ih = H - P.t - P.b, bw = iw / weeks.length;
  const x = (i) => P.l + i * bw + bw / 2, yR = (v) => P.t + ih - (v - 1) / 4 * ih;
  let g = "";
  [1,2,3,4,5].forEach((v) => g += `<line x1="${P.l}" x2="${W-P.r}" y1="${yR(v)}" y2="${yR(v)}" stroke="var(--line)"/><text x="${P.l-8}" y="${yR(v)+4}" font-size="12" fill="var(--faint)" text-anchor="end">${v}★</text>`);
  g += `<text x="${W-P.r+8}" y="${P.t+8}" font-size="12" fill="var(--faint)">${maxN}건</text>`;
  const keys = Object.keys(STORES), gw = bw * 0.7 / keys.length;
  weeks.forEach((w, i) => keys.forEach((k, j) => {
    const a = by[k].get(w), h = a.length / maxN * ih;
    if (a.length) g += `<rect x="${x(i) - bw*0.35 + j*gw}" y="${P.t+ih-h}" width="${gw}" height="${h}" rx="1.5" fill="var(--${k})" opacity=".16"><title>${STORES[k]} · ${fmtDate(new Date(w))} 주 · ${a.length}건 · ★${avg(a).toFixed(2)}</title></rect>`;
  }));
  keys.forEach((k) => {
    const pts = weeks.map((w, i) => { const a = by[k].get(w); return a.length ? [x(i), yR(avg(a)), a] : null; }).filter(Boolean);
    if (!pts.length) return;
    g += `<polyline points="${pts.map((q) => q[0] + "," + q[1]).join(" ")}" fill="none" stroke="var(--${k})" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((q) => g += `<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="var(--surface)" stroke="var(--${k})" stroke-width="1.5"><title>${STORES[k]} · ★${avg(q[2]).toFixed(2)} (${q[2].length}건)</title></circle>`);
  });
  const step = Math.ceil(weeks.length / 9);
  weeks.forEach((w, i) => { if (i % step === 0) { const dt = new Date(w); g += `<text x="${x(i)}" y="${H-6}" font-size="12" fill="var(--faint)" text-anchor="middle">${dt.getMonth()+1}/${dt.getDate()}</text>`; } });
  svg.innerHTML = g;
}

function versions(a) {
  $("ver-title").textContent = `${STORES[S.store]} 버전별 평균`;
  const m = {};
  a.forEach((r) => { if (r.version) (m[r.version] ||= []).push(r); });
  const rows = Object.entries(m).sort((x, y) => y[0].localeCompare(x[0], undefined, { numeric: true })).slice(0, 10);
  $("ver").innerHTML = rows.length ? rows.map(([v, rs]) =>
    `<tr><td>v${esc(v)}</td><td>${rs.length}건</td><td style="color:${tone(avg(rs))};font-weight:600">★${avg(rs).toFixed(2)}</td></tr>`).join("")
    : `<tr><td style="color:var(--faint)">데이터 없음</td></tr>`;
}

function list(a) {
  const conds = [S.rating && `${S.rating}점`, S.cat].filter(Boolean);
  $("count").innerHTML = `${STORES[S.store]} ${a.length.toLocaleString()}건` + (conds.length ? ` · ${esc(conds.join(" · "))} <button class="clear" id="clr">해제</button>` : "");
  if (conds.length) $("clr").onclick = () => { S.rating = 0; S.cat = ""; render(); };
  const q = S.q.trim();
  const hl = (s) => { s = esc(s); if (!q) return s; const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"); return s.replace(re, (m) => `<mark>${m}</mark>`); };
  $("list").innerHTML = a.length ? a.slice(0, S.shown).map((r) => `
    <article class="card rv" data-s="${r.store}">
      <div class="top">
        <span class="stars">${"★".repeat(r.rating)}<span class="off">${"★".repeat(5 - r.rating)}</span></span>
        <span>${fmtDate(r.d)}</span>
        ${r.cats.map((n) => { const c = catOf(n); return `<span class="ctag" style="color:${c.color};background:${c.color}1a">${esc(n)}</span>`; }).join("")}
        ${r.version ? `<span class="tag">v${esc(r.version)}</span>` : ""}
        ${r.replied ? `<span class="tag rep">답변 완료</span>` : ""}
        ${r.likes ? `<span>👍 ${r.likes}</span>` : ""}
      </div>
      ${r.title ? `<div class="t">${hl(r.title)}</div>` : ""}
      <div class="c">${hl(r.content)}</div>
    </article>`).join("") : `<div class="card empty">${S.store === "ios" && !S.all.some((r) => r.store === "ios") ? "아직 수집된 iOS 리뷰가 없어요" : "조건에 맞는 리뷰가 없어요"}</div>`;
  $("more").hidden = a.length <= S.shown;
}

function setStore(s) {
  S.store = s;
  $("f-store").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === s));
}
$("f-store").querySelectorAll("button").forEach((b) => b.onclick = () => { if (S.store !== b.dataset.v) S.rating = 0; setStore(b.dataset.v); S.shown = 30; render(); });
$("f-period").querySelectorAll("button").forEach((b) => b.onclick = () => {
  $("f-period").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  S.period = +b.dataset.v; S.shown = 30; render();
});
let t; $("f-q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { S.q = e.target.value; S.shown = 30; render(); }, 200); };
$("more").onclick = () => { S.shown += 30; render(); };
addEventListener("resize", () => trend(inPeriod()));
</script>
</body>
</html>
